<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>소셜 스튜디오</title>
<style>
  /* 외부 CDN·웹폰트 미사용. 오프라인에서 동작. */
  :root {
    --bg: #f7f7f5; --panel: #fff; --line: #e3e2de; --ink: #23221f;
    --muted: #78756e; --accent: #b4552c; --accent-soft: #fdf1ea;
    --ok: #2f7a4d; --warn: #a8701c; --err: #b3372c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: var(--bg); color: var(--ink);
    font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    font-size: 14px; line-height: 1.55;
  }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 16px; margin-bottom: 16px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  input[type=text], input[type=file] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 6px; font: inherit; background: #fff;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1 1 260px; }
  .btn {
    margin-top: 12px; padding: 9px 18px; border: 0; border-radius: 6px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600;
    cursor: pointer;
  }
  .btn:disabled { background: #c9c6c0; cursor: default; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 11px; }
  .pill.y { background: #e8f3ec; color: var(--ok); }
  .pill.n { background: #f0efec; color: var(--muted); }
  a.setlink { color: var(--accent); font-weight: 600; text-decoration: none; }
  a.setlink:hover { text-decoration: underline; }
  .result { margin-top: 14px; padding: 12px 14px; border-radius: 6px; background: var(--accent-soft); display: none; }
  .result.show { display: block; }
  .result.bad { background: #fdecea; }
  .result ul { margin: 6px 0 0; padding-left: 18px; }
  .result li { font-size: 13px; }
  .kv { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; margin-bottom: 6px; }
  .kv b { font-weight: 600; }
  .empty { color: var(--muted); padding: 14px 2px; font-size: 13px; }
  .err { color: var(--err); }
  .warn { color: var(--warn); }
  .important-box { margin-top: 8px; padding: 8px 12px; background: #fdecea; border: 1px solid var(--err); border-radius: 6px; }
  .important-box b { color: var(--err); }
  .important-box ul { margin: 4px 0 0; padding-left: 18px; }
  .important-box li { font-size: 13px; }
</style>
</head>
<body>

<h1>소셜 스튜디오</h1>
<p class="sub">가사 JSON을 넣으면 유튜브·블로그·SNS에 붙여넣을 글을 한 번에 만듭니다. 발행은 직접 하세요.</p>

<div class="panel">
  <h2>1. 텍스트 팩 만들기</h2>
  <div class="row">
    <div>
      <label for="file">가사 JSON 파일</label>
      <input type="file" id="file" accept=".json,application/json" />
    </div>
    <div>
      <label for="url">유튜브 주소 (선택 · 나중에 입력해도 됨)</label>
      <input type="text" id="url" placeholder="https://youtu.be/..." />
    </div>
  </div>
  <button class="btn" id="runBtn" disabled>생성</button>
  <div class="result" id="result"></div>
</div>

<div class="panel">
  <h2>2. 만들어진 세트</h2>
  <div id="sets"><div class="empty">불러오는 중…</div></div>
  <button class="btn ghost" id="reloadBtn">새로고침</button>
</div>

<script>
(function () {
  var fileEl = document.getElementById('file');
  var urlEl = document.getElementById('url');
  var runBtn = document.getElementById('runBtn');
  var resultEl = document.getElementById('result');
  var setsEl = document.getElementById('sets');

  fileEl.addEventListener('change', function () {
    runBtn.disabled = !fileEl.files.length;
  });

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function pill(on) {
    return on ? '<span class="pill y">있음</span>' : '<span class="pill n">없음</span>';
  }

  function loadSets() {
    setsEl.innerHTML = '<div class="empty">불러오는 중…</div>';
    fetch('/social-studio/api/sets')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var sets = d.sets || [];
        if (!sets.length) {
          setsEl.innerHTML = '<div class="empty">아직 만들어진 세트가 없습니다. 위에서 가사 JSON을 넣고 생성하세요.</div>';
          return;
        }
        var rows = '';
        for (var i = 0; i < sets.length && i < 500; i++) {
          var s = sets[i];
          rows += '<tr>'
            + '<td><a class="setlink" href="/social-studio/pack/' + encodeURIComponent(s.setName) + '">' + esc(s.setName) + '</a></td>'
            + '<td>' + pill(s.hasTextpack) + '</td>'
            + '<td>' + pill(s.hasCards) + '</td>'
            + '<td>' + pill(s.hasLintReport) + '</td>'
            + '</tr>';
        }
        setsEl.innerHTML = '<table><thead><tr><th>세트</th><th>텍스트 팩</th><th>카드</th><th>검사</th></tr></thead><tbody>'
          + rows + '</tbody></table>';
      })
      .catch(function (e) {
        setsEl.innerHTML = '<div class="empty err">목록을 불러오지 못했습니다: ' + esc(e.message) + '</div>';
      });
  }

  function show(html, bad) {
    resultEl.className = 'result show' + (bad ? ' bad' : '');
    resultEl.innerHTML = html;
  }

  runBtn.addEventListener('click', function () {
    var f = fileEl.files[0];
    if (!f) return;
    runBtn.disabled = true;
    show('생성 중…', false);

    var reader = new FileReader();
    reader.onerror = function () {
      runBtn.disabled = false;
      show('<b class="err">파일을 읽지 못했습니다.</b>', true);
    };
    reader.onload = function () {
      fetch('/social-studio/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: String(reader.result), youtubeUrl: urlEl.value.trim() })
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          runBtn.disabled = false;
          if (!res.ok) {
            show('<b class="err">실패:</b> ' + esc(res.d.error || '알 수 없는 오류'), true);
            return;
          }
          var d = res.d;
          var cov = d.coverage || {};
          var html = '<div class="kv">'
            + '<span><b>세트</b> ' + esc(d.setName) + '</span>'
            + '<span><b>채널</b> ' + esc(d.channelId) + '</span>'
            + '<span><b>곡</b> ' + esc(d.songCount) + '</span>'
            + '<span><b>사전 커버리지</b> 명사 ' + esc(cov.nouns) + ' / 감정 ' + esc(cov.emotions) + '</span>'
            + '<span><b>미지어</b> ' + esc(d.unknownTerms) + '건</span>'
            + '</div>';
          if (d.unmatchedEmotionArcs) {
            html += '<div class="warn">emotionArc 파싱 실패 ' + esc(d.unmatchedEmotionArcs) + '건</div>';
          }
          // TASK-S9 후속: /api/generate 응답의 warnings는 이미 서버에서
          // normalized.set.warnings + textpack.warnings를 합치고 중복을
          // 제거해서 온다(homeRoutes.js) — 화면은 [중요] 접두만 갈라서
          // 붉은 상자로 분리하면 된다.
          var allWarnings = d.warnings || [];
          var importantWarnings = allWarnings.filter(function (w) { return w.indexOf('[중요]') === 0; });
          var normalWarnings = allWarnings.filter(function (w) { return w.indexOf('[중요]') !== 0; });
          if (importantWarnings.length) {
            html += '<div class="important-box"><b>중요</b><ul>';
            for (var k = 0; k < importantWarnings.length && k < 30; k++) html += '<li>' + esc(importantWarnings[k]) + '</li>';
            html += '</ul></div>';
          }
          if (normalWarnings.length) {
            html += '<div class="warn">경고 ' + normalWarnings.length + '건<ul>';
            for (var i = 0; i < normalWarnings.length && i < 30; i++) html += '<li>' + esc(normalWarnings[i]) + '</li>';
            html += '</ul></div>';
          }
          if ((d.errors || []).length) {
            html += '<div class="err">오류 ' + d.errors.length + '건<ul>';
            for (var j = 0; j < d.errors.length && j < 30; j++) html += '<li>' + esc(d.errors[j]) + '</li>';
            html += '</ul></div>';
          }
          html += '<p style="margin:10px 0 0"><a class="setlink" href="' + esc(d.packUrl) + '">복사 화면 열기 →</a></p>';
          show(html, false);
          loadSets();
        })
        .catch(function (e) {
          runBtn.disabled = false;
          show('<b class="err">실패:</b> ' + esc(e.message), true);
        });
    };
    reader.readAsText(f, 'utf-8');
  });

  document.getElementById('reloadBtn').addEventListener('click', loadSets);
  loadSets();
})();
</script>
</body>
</html>
